[project]
name = "pyrunner"
version = "0.1.0"
description = "Python script management and task execution platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
